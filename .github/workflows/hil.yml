# Cross-compile for the STM32H753XI-EVAL2 target (ARM Cortex-M7, Os::Baremetal
# single-threaded cyclic executive) and run HIL integration tests on the self-hosted
# Raspberry Pi runner wired to the physical board over UART/ST-Link.
#
# Runs on this repo's own push/PR (using the committed lib/fprime submodule pin) and
# on workflow_dispatch from nasa/fprime's ext-fprime-stm32-baremetal-reference.yml,
# which overlays an exact F´ commit under lib/fprime and polls this run's result.

name: HIL Tests (STM32H753XI-EVAL2)
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.dispatch_id != '' && format('hil {0} ({1}@{2})', inputs.dispatch_id, inputs.fprime_repository, inputs.fprime_ref) || '' }}

on:
  push:
    branches: [ devel ]
  pull_request:
    branches: [ devel ]
  schedule:
    - cron: "0 21 * * *"  # Nightly at 2:00 PM US/Pacific (PDT)
  workflow_dispatch:
    inputs:
      fprime_repository:
        description: "F´ repository to overlay under lib/fprime (<owner>/<repo>)"
        type: string
        default: nasa/fprime
      fprime_ref:
        description: "F´ ref to overlay; the dispatcher passes an exact commit SHA"
        type: string
        default: devel
      fprime_pr_number:
        description: "nasa/fprime PR number being tested (empty for branch/nightly runs); used to pick nasa/fprime-gds@pr-<N>"
        type: string
        default: ""
      dispatch_id:
        description: "Correlation id set by the dispatcher (informational)"
        type: string
        default: ""

# Cancel in-progress runs if a newer run is started on a given PR; dispatched/nightly/push
# runs are never auto-cancelled by a newer one (each is its own distinct revision under test).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.dispatch_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FPRIME_LOCATION: ./lib/fprime
  DEPLOYMENT: ReferenceDeployment

permissions:
  contents: read

jobs:
  cross-compilation:
    name: "Cross-Compile (stm32h7) + Host Unit Tests"
    runs-on: ubuntu-22.04
    steps:
      - name: "Setup output-cleaner"
        uses: nasa/fprime-actions/output-cleaner@devel
      - name: "Checkout project"
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: "Overlay requested F´ revision"
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.fprime_repository }}
          ref: ${{ inputs.fprime_ref }}
          path: ${{ env.FPRIME_LOCATION }}
          submodules: true
          fetch-depth: 0
          filter: blob:none
      - name: "Setup F' Tools"
        uses: nasa/fprime-actions/setup@devel
        with:
          location: ${{ env.FPRIME_LOCATION }}
      - name: "Install ARM GNU Toolchain"
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-dev
        shell: bash
      - name: "Generate stm32h7 Build Cache"
        run: |
          fprime-util generate stm32h7 2>&1 | output-cleaner
        shell: bash
      - name: "Cross-Compile Binary"
        run: |
          fprime-util build stm32h7 -j"$(nproc)" 2>&1 | output-cleaner
        shell: bash
      - name: "Host-Native Unit Tests (GTest)"
        run: |
          fprime-util generate --ut 2>&1 | output-cleaner
          for module in \
            FprimeStm32BaremetalReference/Components/Led \
            lib/fprime-stm32/fprime-stm32/Drv/STM32GpioDriver \
            lib/fprime-stm32/fprime-stm32/Drv/STM32I2cDriver \
            lib/fprime-stm32/fprime-stm32/Drv/STM32SpiDriver \
            lib/fprime-stm32/fprime-stm32/Drv/STM32Timer \
            lib/fprime-stm32/fprime-stm32/Drv/STM32UartDriver; do
            (cd "${GITHUB_WORKSPACE}/${module}" && fprime-util check --coverage 2>&1 | output-cleaner)
          done
        shell: bash
      - name: "Report resource margin"
        run: |
          arm-none-eabi-size -A ./build-artifacts/stm32h7/${DEPLOYMENT}/bin/${DEPLOYMENT} | tee resource-margin.txt
        shell: bash
      - name: "Prepare artifacts"
        run: |
          mkdir -p stm32-artifacts
          cp -r ./build-artifacts stm32-artifacts
          cp -r FprimeStm32BaremetalReference/Deployments/ReferenceDeployment/test/int stm32-artifacts
          cp resource-margin.txt stm32-artifacts
        shell: bash
      - name: "Archive Build Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: stm32-artifacts
          path: stm32-artifacts
          retention-days: 5

  HIL-integration:
    name: "HIL Integration Tests (STM32H753XI-EVAL2)"
    runs-on: [self-hosted, baremetal]
    needs: cross-compilation
    timeout-minutes: 30
    # `hil-hardware` must be configured (repo Settings > Environments) with required
    # reviewers: it is the approval gate for dispatched (fork-F´) refs. The key alone
    # enforces nothing - GitHub auto-creates an unprotected environment on first use
    # if it doesn't already exist with that rule configured. Scoped to workflow_dispatch
    # only (empty string = no environment) so this repo's own trusted push/PR/nightly
    # runs aren't blocked waiting on human approval too.
    environment: ${{ github.event_name == 'workflow_dispatch' && 'hil-hardware' || '' }}
    # Fork PRs of THIS repo never reach the board: same-repo-head check, same shape as
    # the trust gate this job always had, now evaluated against this repo's own PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      # Single source of truth for the rig baseline, run both before and after
      # the test steps - a changed pin wiring only needs updating here.
      RIG_BASELINE_CMD: |
        pinctrl set 25 op dh  # SCL connected
        pinctrl set 8  op dh  # SDA connected
        pinctrl set 7  op dh  # MOSI connected
        pinctrl set 12 op dh  # MISO connected
        pinctrl set 16 op dh  # CS connected
        pinctrl set 20 op dh  # SCK connected
        pinctrl set 21 op dl  # sensor 3V3 rail on (active-low)
        pinctrl set 24 op dl  # heater off
    steps:
      - name: "Checkout requirements.txt"
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: "Setup environment"
        run: |
          python -m venv venv
          . venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          echo "${PWD}/venv/bin" >> "${GITHUB_PATH}"
        shell: bash
      # Upgrade GDS to a matching pr-xxxx branch if it exists; never fall back to devel
      - name: "Upgrade fprime-gds to pr-xxxx (if it exists)"
        if: github.event_name == 'workflow_dispatch' && inputs.fprime_pr_number != ''
        uses: nasa/fprime-actions/upgrade-package@devel
        with:
          repository: nasa/fprime-gds
          pr-branch-only: true
      - name: "Artifacts Download"
        uses: actions/download-artifact@v4
        with:
          name: stm32-artifacts
      - name: "Reset GPIO fault-injection rig to baseline"
        run: eval "$RIG_BASELINE_CMD"
        shell: bash
      # OpenOCD and the ST-Link udev rules are expected to be pre-provisioned on
      # this runner (hardware-specific setup, not reinstalled every run).
      - name: "Flash board via OpenOCD/ST-Link"
        run: |
          . venv/bin/activate
          openocd -f interface/stlink.cfg -f target/stm32h7x.cfg \
            -c "program ./build-artifacts/stm32h7/${DEPLOYMENT}/bin/${DEPLOYMENT} verify reset exit"
        shell: bash
      - name: "Run Integration Tests"
        run: |
          . venv/bin/activate
          mkdir -p ci-logs
          fprime-gds --no-app --communication-selection uart \
            --uart-device /dev/ttyACM0 --uart-baud 115200 \
            -d ./build-artifacts/stm32h7/${DEPLOYMENT} --logs ./ci-logs &
          sleep 10
          pytest -o python_files="*_integration_tests.py" \
            --dictionary ./build-artifacts/stm32h7/${DEPLOYMENT}/dict/${DEPLOYMENT}TopologyDictionary.json \
            --logs ./ci-logs --junit-xml-file hil-results.xml --gen-junitxml \
            ./int/
        shell: bash
      - name: "Return GPIO fault-injection rig to baseline"
        if: always()
        run: eval "$RIG_BASELINE_CMD"
        shell: bash
      - name: "Sanitize log filenames for upload-artifact"
        if: always()
        run: find ci-logs -depth -name '*:*' -exec bash -c 'mv "$1" "${1//:/-}"' _ {} \;
        shell: bash
      - name: "Archive logs"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stm32-hil-logs
          path: ci-logs
          retention-days: 5
