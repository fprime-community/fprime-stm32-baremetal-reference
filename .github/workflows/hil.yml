name: HIL Tests (STM32H753XI-EVAL2)

# This repo does NOT run HIL tests itself. Only one self-hosted runner exists
# for this hardware, and per maintainer direction it is registered against
# nasa/fprime only - not a second time against this repo. Instead, this
# workflow runs on a hosted GitHub runner and remotely dispatches
# nasa/fprime's lib/fprime/.github/workflows/ext-fprime-stm32-baremetal-reference.yml
# (workflow_dispatch), which is the workflow that actually runs on the Pi.
#
# Maintainer-gated: a PR must already be reviewed, then a maintainer comments
# "/run-hil" to trigger this. Never triggered directly off `pull_request` -
# a fork PR could otherwise get its untrusted code built and flashed onto
# the physical board with no human in the loop.
#
# Requires a `HIL_DISPATCH_TOKEN` secret on this repo: a PAT (or fine-grained
# token) with `actions:write` on nasa/fprime, used to fire the
# workflow_dispatch event there. Without it this job fails at the first step.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: write
  statuses: write

jobs:
  dispatch-hil:
    name: Dispatch HIL run on the nasa/fprime Pi runner
    if: >
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/run-hil') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest

    steps:
      - name: Resolve PR head commit
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('sha', pr.head.sha);

      - name: Mark HIL run pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ steps.pr.outputs.sha }}',
              state: 'pending',
              context: 'hil-tests',
              description: 'Dispatched to nasa/fprime HIL runner',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      # Fires the workflow_dispatch event on nasa/fprime.
      - name: Dispatch ext-fprime-stm32-baremetal-reference.yml on nasa/fprime
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.HIL_DISPATCH_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'nasa',
              repo: 'fprime',
              workflow_id: 'ext-fprime-stm32-baremetal-reference.yml',
              ref: 'devel',
              inputs: {
                target_ref: '${{ steps.pr.outputs.sha }}',
                callback_repo: '${{ github.repository }}',
                callback_sha: '${{ steps.pr.outputs.sha }}',
              },
            });

      - name: Comment with a link to watch the dispatched run
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `HIL run dispatched to the nasa/fprime Pi runner for \`${{ steps.pr.outputs.sha }}\`. ` +
                `Watch it at https://github.com/nasa/fprime/actions/workflows/ext-fprime-stm32-baremetal-reference.yml - ` +
                `the \`hil-tests\` status on this PR will update once it finishes.`,
            });
