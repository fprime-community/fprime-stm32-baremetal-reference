[pytest]
# HIL integration test files are named "*_integration_tests.py" (plural), which pytest's
# default python_files glob (test_*.py / *_test.py) does not match - without this, running
# pytest against the test/int/ directory (as .github/workflows/hil.yml does) silently
# collects 0 tests.
python_files = test_*.py *_test.py *_tests.py
